<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Guitar to Game Control</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin-top: 50px; }
        #note { font-size: 48px; color: #4CAF50; margin: 20px; font-weight: bold; }
        button { padding: 15px 30px; font-size: 18px; background: #ff5722; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #e64a19; }
    </style>
</head>
<body>

    <h1>🎮 Controle de Guitarra para Pokémon FireRed</h1>
    <p>Toque uma corda na caixa de som para o S21 escutar!</p>
    
    <button onclick="startListening()">Ligar Escuta do Microfone</button>
    
    <div id="note">Aguardando som...</div>

    <script>
        let audioCtx;
        let analyser;
        let microphone;
        let isRunning = false;

        async function startListening() {
            if (isRunning) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                microphone = audioCtx.createMediaStreamSource(stream);
                
                analyser.fftSize = 2048;
                microphone.connect(analyser);
                
                isRunning = true;
                document.querySelector("button").style.display = "none";
                document.getElementById("note").innerText = "Ouvindo...";
                
                detectPitch();
            } catch (err) {
                alert("Erro ao acessar o microfone: " + err);
            }
        }

        function autoCorrelate(buffer, sampleRate) {
            let SIZE = buffer.length;
            let sumOfSquares = 0;
            for (let i = 0; i < SIZE; i++) {
                let val = buffer[i];
                sumOfSquares += val * val;
            }
            let rootMeanSquare = Math.sqrt(sumOfSquares / SIZE);
            if (rootMeanSquare < 0.001) return -1;

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs(buffer[SIZE - i]) < thres) { r2 = SIZE - i; break; }
            }

            buffer = buffer.slice(r1, r2);
            SIZE = buffer.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    c[i] = c[i] + buffer[j] * buffer[j + i];
                }
            }

            let d = 0;
            while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;
            return sampleRate / T0;
        }

        function getNoteName(freq) {
            // Frequências aproximadas das cordas da guitarra
            const notes = [
                { name: "Mi Grave (E2)", freq: 82.41 },
                { name: "Lá (A2)", freq: 110.00 },
                { name: "Ré (D3)", freq: 146.83 },
                { name: "Sol (G3)", freq: 196.00 },
                { name: "Si (B3)", freq: 246.94 },
                { name: "Mi Agudo (E4)", freq: 329.63 }
            ];

            let closest = notes[0];
            let minDiff = Math.abs(freq - closest.freq);

            for (let i = 1; i < notes.length; i++) {
                let diff = Math.abs(freq - notes[i].freq);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = notes[i];
                }
            }

            // Se a diferença for aceitável, retorna o nome da nota
            if (minDiff < 15) {
                return `${closest.name} (${freq.toFixed(1)} Hz)`;
            }
            return `Frequência: ${freq.toFixed(1)} Hz`;
        }

        function detectPitch() {
            let buffer = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(buffer);
            let freq = autoCorrelate(buffer, audioCtx.sampleRate);

            if (freq !== -1) {
                let resultText = getNoteName(freq);
                document.getElementById("note").innerText = resultText;
            }
            
            requestAnimationFrame(detectPitch);
        }
    </script>
</body>
</html>
